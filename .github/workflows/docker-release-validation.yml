name: Docker Release Validation
run-name: Docker release gate · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    paths:
      - ".github/scripts/docker_release_e2e.py"
      - ".github/scripts/browser_release_e2e.mjs"
      - ".github/workflows/docker-release-validation.yml"
      - "backend/**"
      - "frontend/**"
      - "templates/**"
      - "examples/docker-release-example.md"
      - "docker-compose.yml"
  pull_request:
    paths:
      - ".github/scripts/docker_release_e2e.py"
      - ".github/scripts/browser_release_e2e.mjs"
      - ".github/workflows/docker-release-validation.yml"
      - "backend/**"
      - "frontend/**"
      - "templates/**"
      - "examples/docker-release-example.md"
      - "docker-compose.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-e2e:
    name: Clean Compose build and E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js for browser validation
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Record clean-runner environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-artifacts
          {
            echo "commit=${GITHUB_SHA}"
            uname -a
            cat /etc/os-release
            docker --version
            docker compose version
            google-chrome --version
          } | tee validation-artifacts/environment.txt
          docker compose config > validation-artifacts/compose-config.yml

      - name: Build frontend and backend images
        shell: bash
        run: |
          set -euo pipefail
          started_at=$(date +%s)
          docker compose build --pull 2>&1 | tee validation-artifacts/build.log
          finished_at=$(date +%s)
          echo "build_seconds=$((finished_at - started_at))" | tee validation-artifacts/build-time.txt
          docker compose images | tee validation-artifacts/images.txt

      - name: Start the complete stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose up --detach --wait
          docker compose ps | tee validation-artifacts/first-start.txt
          docker compose exec --no-TTY backend sh -c \
            'test "$(id -u)" = "10001" && test "$(id -g)" = "10001" && test -w /tmp/ai2doc'
          docker compose exec --no-TTY backend pandoc --version \
            | head --lines=1 | tee validation-artifacts/pandoc-version.txt
          docker compose exec --no-TTY frontend wget -q -T 2 -O /dev/null \
            http://127.0.0.1:8080/
          curl --fail --show-error --silent http://localhost:8080/health/ready \
            | tee validation-artifacts/readiness.json
          curl --fail --show-error --silent http://localhost:8080/ \
            > validation-artifacts/frontend.html
          grep --fixed-strings "AI2Doc" validation-artifacts/frontend.html
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=3000 --dump-dom http://localhost:8080/ \
            > validation-artifacts/browser-first-start.html
          grep --fixed-strings "Generate DOCX" \
            validation-artifacts/browser-first-start.html

      - name: Drive the real browser conversion flow
        shell: bash
        env:
          AI2DOC_E2E_BASE_URL: http://localhost:8080
          AI2DOC_E2E_INPUT: examples/docker-release-example.md
          AI2DOC_E2E_ARTIFACT_DIR: validation-artifacts
          CHROME_DEBUG_URL: http://127.0.0.1:9222
        run: |
          set -euo pipefail
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --remote-allow-origins='*' \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/ai2doc-chrome about:blank \
            > validation-artifacts/chrome.log 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9222/json/version > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Chrome DevTools endpoint did not start" >&2
              exit 1
            fi
            sleep 1
          done
          node .github/scripts/browser_release_e2e.mjs

      - name: Convert and inspect a real academic DOCX
        env:
          AI2DOC_E2E_BASE_URL: http://localhost:8080
          AI2DOC_E2E_INPUT: examples/docker-release-example.md
          AI2DOC_E2E_ARTIFACT_DIR: validation-artifacts
        run: python .github/scripts/docker_release_e2e.py

      - name: Stop and restart the stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose down
          docker compose up --detach --wait
          docker compose ps | tee validation-artifacts/restart.txt
          curl --fail --show-error --silent http://localhost:8080/health/ready \
            | tee validation-artifacts/restart-readiness.json
          curl --fail --show-error --silent http://localhost:8080/ \
            > validation-artifacts/restart-frontend.html
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=3000 --dump-dom http://localhost:8080/ \
            > validation-artifacts/browser-restart.html
          grep --fixed-strings "Generate DOCX" \
            validation-artifacts/browser-restart.html

      - name: Collect runtime evidence
        if: always()
        shell: bash
        run: |
          docker compose ps --all > validation-artifacts/compose-ps.txt 2>&1 || true
          docker compose logs --no-color > validation-artifacts/compose.log 2>&1 || true
          backend_id=$(docker compose ps --quiet backend 2>/dev/null || true)
          frontend_id=$(docker compose ps --quiet frontend 2>/dev/null || true)
          if [ -n "$backend_id" ]; then
            docker inspect --format '{{json .State.Health}}' "$backend_id" \
              > validation-artifacts/backend-health.json 2>&1 || true
          fi
          if [ -n "$frontend_id" ]; then
            docker inspect --format '{{json .State.Health}}' "$frontend_id" \
              > validation-artifacts/frontend-health.json 2>&1 || true
          fi

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-release-validation-${{ github.sha }}
          path: validation-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Clean up containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
