name: Bug report
description: Report a reproducible problem in AI2Doc.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve AI2Doc. Do not attach private AI conversations or confidential documents.

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What happened, and what did you expect instead?
      placeholder: A concise description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a minimal, non-sensitive Markdown example when possible.
      placeholder: |
        1. Start AI2Doc with...
        2. Select the ... template
        3. Submit ...
        4. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AI2Doc version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, browser, Docker/Compose version, and whether you used local development or containers.
      placeholder: Windows 11, Chrome 140, Docker Desktop ..., Docker Compose ...
    validations:
      required: true

  - type: dropdown
    id: input-mode
    attributes:
      label: Input method
      options:
        - Pasted text
        - Markdown upload
        - Both
        - Not applicable
    validations:
      required: true

  - type: dropdown
    id: template
    attributes:
      label: Template
      options:
        - Academic
        - Report
        - Notes
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove local paths, tokens, private content, and personal information before pasting logs.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed private or confidential document content.
          required: true
