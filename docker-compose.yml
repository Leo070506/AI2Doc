name: ai2doc

services:
  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AI2DOC_PANDOC_PATH: /usr/local/bin/pandoc
      AI2DOC_STORAGE_ROOT: /tmp/ai2doc
      AI2DOC_TEMPLATES_ROOT: /app/templates
      AI2DOC_CORS_ORIGINS: http://localhost:8080
    tmpfs:
      - /tmp/ai2doc:size=64m,mode=0700,uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped
